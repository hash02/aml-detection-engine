name: Refresh threat feeds daily

on:
  schedule:
    # 02:00 UTC daily. Upstream OFAC / ScamSniffer feeds update asynchronously.
    # 2026-10-21 (C-2): the September equivalent-expression edit did not restore
    # this workflow's schedule registration while sibling workflows in the same
    # repo fire on schedule, so the fault is isolated to this registration.
    # Re-register by returning the expression to its canonical daily form.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: aml-generated-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal deps
        run: pip install requests pandas

      - name: Refresh feeds
        run: |
          python scripts/refresh_feeds.py

      - name: Populate addresses from feeds + MANIFEST
        run: |
          # Fail-closed populate (scripts/populate_addresses.py):
          # a mapped feed whose cache file is missing (its fetch
          # failed in the refresh step) fails the job here instead
          # of silently keeping the previous snapshot under a fresh
          # MANIFEST timestamp, and last_updated only moves when a
          # feed file actually changed.
          python scripts/populate_addresses.py data/feeds addresses

      - name: Validate refreshed snapshot (data-quality invariant)
        run: |
          # Fail the job (which fires the alert issue) if any feed's
          # new snapshot is junk, emptied, or catastrophically
          # shrunk versus the committed one. Counts alone proved
          # nothing in 2026: the committed phishing snapshot held
          # 189 domain strings and zero valid addresses.
          python scripts/validate_feed_snapshot.py addresses/

      - name: Stage refreshed feeds (guarded)
        run: |
          # The staging pathspec is checked with git's own ignore
          # semantics before staging. This is the exact failure that
          # broke this workflow for 91 consecutive runs in 2026, when
          # the commit step staged the gitignored data/feeds/ path.
          bash scripts/check_stage_paths.sh addresses/
          git add -- addresses/

      - name: Commit refreshed feeds
        run: |
          git config user.name "Threat Feed Bot"
          git config user.email "feeds@bionicbanker.tech"
          if git diff --staged --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh threat feeds from upstream"
          git push

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Threat feed refresh is failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled threat-feed refresh failed.",
              "",
              `Run: ${runUrl}`,
              "",
              "This issue is maintained by the workflow itself so feed failures cannot pass silently. (The refresh previously failed 91 scheduled runs in a row, Apr to Jul 2026, without any human noticing.)"
            ].join("\n");
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`
            });
            if (found.data.total_count > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.data.items[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
