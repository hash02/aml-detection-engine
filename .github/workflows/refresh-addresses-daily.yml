name: Refresh threat feeds daily

on:
  schedule:
    # 02:00 UTC daily. Upstream OFAC / MetaMask feeds update asynchronously.
    # Equivalent expression reactivates the inactivity-disabled schedule.
    - cron: '0 2 * * 0-6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: aml-generated-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal deps
        run: pip install requests pandas

      - name: Refresh feeds
        run: |
          python scripts/refresh_feeds.py

      - name: Populate addresses from feeds + MANIFEST
        run: |
          python - <<'PY'
          import json, time, hashlib
          from pathlib import Path
          FEEDS = Path('data/feeds')
          ADDR = Path('addresses')
          ADDR.mkdir(parents=True, exist_ok=True)
          MAPPING = {
              'ofac_sdn':       ('ofac.json',     'https://raw.githubusercontent.com/0xB10C/ofac-sanctioned-digital-currency-addresses'),
              'metamask_phish': ('phishing.json', 'https://github.com/MetaMask/eth-phishing-detect'),
              'mixers':         ('mixers.json',   'engine/feeds.py BASELINE_MIXERS'),
              'bridges':        ('bridges.json',  'engine/feeds.py BASELINE_BRIDGES'),
              'lrt_offramps':   ('offramps.json', 'engine/feeds.py BASELINE_LRT_OFFRAMPS'),
          }
          for feed_name, (addr_name, source) in MAPPING.items():
              src = FEEDS / f'{feed_name}.json'
              if not src.exists(): continue
              data = json.loads(src.read_text())
              out = {
                  'feed': feed_name,
                  'updated_at': data['updated_at'],
                  'count': data['count'],
                  'source': source,
                  'addresses': data['addresses'],
              }
              (ADDR / addr_name).write_text(json.dumps(out, indent=2))
          checksums = {f.name: hashlib.sha256(f.read_bytes()).hexdigest()[:16]
                       for f in ADDR.glob('*.json') if f.name != 'MANIFEST.json'}
          manifest = {
              'version': '0.2.0',
              'last_updated': time.time(),
              'last_updated_iso': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'source': 'hash02/aml-detection-engine',
              'schema': {
                  'ofac.json': 'OFAC SDN ethereum addresses',
                  'phishing.json': 'MetaMask eth-phishing-detect aggregate',
                  'exploits.json': 'Analyst-curated exploit wallet list',
                  'mixers.json': 'Tornado Cash pools + routers',
                  'bridges.json': 'Cross-chain bridge routers',
                  'offramps.json': 'No-KYC offramps + drainer infrastructure',
              },
              'checksums': checksums,
              'consumers': ['hash02/aml-roaster'],
          }
          (ADDR / 'MANIFEST.json').write_text(json.dumps(manifest, indent=2))
          PY

      - name: Stage refreshed feeds (guarded)
        run: |
          # The staging pathspec is checked with git's own ignore
          # semantics before staging. This is the exact failure that
          # broke this workflow for 91 consecutive runs in 2026, when
          # the commit step staged the gitignored data/feeds/ path.
          bash scripts/check_stage_paths.sh addresses/
          git add -- addresses/

      - name: Commit refreshed feeds
        run: |
          git config user.name "Threat Feed Bot"
          git config user.email "feeds@bionicbanker.tech"
          if git diff --staged --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh threat feeds from upstream"
          git push

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Threat feed refresh is failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled threat-feed refresh failed.",
              "",
              `Run: ${runUrl}`,
              "",
              "This issue is maintained by the workflow itself so feed failures cannot pass silently. (The refresh previously failed 91 scheduled runs in a row, Apr to Jul 2026, without any human noticing.)"
            ].join("\n");
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`
            });
            if (found.data.total_count > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.data.items[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
