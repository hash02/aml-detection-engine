name: AML Monitoring

on:
  schedule:
    # Equivalent expression reactivates the inactivity-disabled schedule.
    - cron: '0 14 * * 0-6'  # Daily 2PM UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: aml-generated-data
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AML monitor
        run: python scripts/monitor.py
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

      # Raw per-run CSVs stay gitignored. A day is a few hundred KB
      # (the 2026-11-26 run scanned 320 rows, on the order of 100 KB,
      # and token rows may roughly double that). Committing them would
      # grow the repo every day with no retention. 14 days is enough
      # to inspect a run after the alert markdown lands.
      - name: Upload per-run monitoring CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-csvs
          path: data/monitoring/*.csv
          retention-days: 14
          if-no-files-found: warn

      - name: Commit alerts
        run: |
          git config user.name "AML Monitor"
          git config user.email "monitor@bionicbanker.tech"
          git add data/monitoring/ config/watchlist.json
          git diff --staged --quiet || git commit -m "AML alert: $(date +%Y-%m-%d)"
          git push
